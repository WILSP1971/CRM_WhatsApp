# Alertmanager — configuración BASE (SPEC-077, PLAN-010 F0)
#
# Alcance de esta SPEC (077): solo levantar el servicio Alertmanager en
# `ia_internal` con config mínima válida. Las reglas de alerta-as-code, el
# enrutado (`route`) y los `receivers` concretos son SPEC-078 (F1) — fuera de
# alcance aquí (ver SPEC-077.md, sección OUT).
#
# INVARIANTE (Q1-sub, PLAN-010 §1 — vinculante, NO se reabre en esta SPEC):
# alertas visibles SOLO en Grafana/Alertmanager, CERO notificación push
# externa (Telegram/Slack/email/PagerDuty). El receiver "null" de abajo es el
# único definido en esta SPEC: no envía nada a ningún destino externo, solo
# satisface el requisito de Alertmanager de tener al menos una ruta/receiver
# válidos para arrancar. SPEC-078 añadirá receivers adicionales (igualmente
# sin notificación externa) cuando defina las reglas de alerta.

global:
  resolve_timeout: 5m

route:
  receiver: "null"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "null"
    # Receiver inerte (sin webhook/email/etc.) — cero integración externa,
    # cero egress nuevo (RNF-NO-EGRESS, R-101). SPEC-078 define receivers
    # reales de enrutado (siempre sin push externo, Q1-sub).
