# Grafana — provisioning de datasource (SPEC-077, PLAN-010 F0)
#
# Datasource Prometheus versionado en el repo (provisioning as-code,
# RNF-REPRODUCIBLE): NO se crea a mano en la UI. Apunta al servicio
# `prometheus` por la red interna `ia_internal` (sin egress). Sin
# credenciales: Prometheus/Alertmanager no quedan expuestos sin protección al
# exterior (no requieren auth propia dentro de `ia_internal`); el UI
# protegido con auth es el de Grafana (C3, RF-04).

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
