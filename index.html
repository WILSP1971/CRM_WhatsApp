<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="OmniCore AI — Maqueta de alta fidelidad del CRM inteligente omnicanal (datos simulados, sin backend)."
    />
    <!--
      CHECKPOINT (proyecto SENSIBLE / .no-externo): prohibido enlazar CDNs, Google Fonts remoto
      u otros recursos de terceros. Todo self-hosted. Ver src/styles/fonts.css.
    -->
    <title>OmniCore AI — CRM Inteligente Omnicanal</title>
    <script>
      // Aplica el tema ANTES del primer paint para evitar parpadeo (FOUC)
      // al alternar oscuro/claro. Persistencia en localStorage (SPEC-002 RF-03).
      (function () {
        try {
          var stored = localStorage.getItem("omnicore-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
