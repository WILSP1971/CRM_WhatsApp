name: CI — Build, Lint, Tests, Check Externos

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Lint, Tests, Externos
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Security audit with npm audit (SPEC-082, RF-02)
        run: |
          # `npm audit` sale con 1 si encuentra vulnerabilidades -- el gate real es
          # el step siguiente (Python, fuente autoritativa M-2), así que aquí solo
          # generamos el reporte JSON sin dejar que este step aborte por `set -e`.
          npm audit --json > npm-audit-report.json || true
          echo "✓ npm audit completed (checking for HIGH/CRITICAL vulnerabilities)"

      - name: Enforce npm audit gate (fail on HIGH/CRITICAL, SPEC-082, RF-02)
        run: |
          python3 << 'EOF'
          import json
          import sys

          try:
              with open('npm-audit-report.json') as f:
                  report = json.load(f)
          except FileNotFoundError:
              print("✓ npm audit report not found (no vulnerabilities)")
              sys.exit(0)

          # Check for HIGH and CRITICAL vulnerabilities.
          # (BLACK WIDOW, M-2, SPEC-082): la fuente AUTORITATIVA es la lista real de
          # `report['vulnerabilities']` (por paquete/severidad), no el contador de
          # `metadata.vulnerabilities` -- en algunos formatos de `npm audit --json`
          # ese contador puede no coincidir con la lista real (falso-verde si el
          # contador da 0 pero sí hay entradas HIGH/CRITICAL en la lista). El
          # metadata se usa solo como cross-check informativo, nunca como fuente
          # de la decisión de bloquear el gate.
          vulnerable_packages = [
              (pkg_name, vuln_data.get('severity', 'unknown'))
              for pkg_name, vuln_data in report.get('vulnerabilities', {}).items()
              if vuln_data.get('severity') in ('high', 'critical')
          ]
          high_critical_count = len(vulnerable_packages)

          metadata = report.get('metadata', {})
          metadata_vulns = metadata.get('vulnerabilities', {})
          metadata_count = metadata_vulns.get('high', 0) + metadata_vulns.get('critical', 0)
          if metadata_count != high_critical_count:
              print(
                  f"::warning::npm audit metadata count ({metadata_count}) no coincide con "
                  f"el conteo real de 'vulnerabilities' ({high_critical_count}); se usa el "
                  "conteo real como fuente autoritativa del gate (M-2)."
              )

          if high_critical_count > 0:
              print(f"::error::Found {high_critical_count} HIGH/CRITICAL vulnerabilities in npm audit")
              print("\nVulnerable packages:")
              for pkg_name, severity in vulnerable_packages:
                  print(f"  - {pkg_name}: {severity}")
              sys.exit(1)
          else:
              print("✓ npm audit passed (no HIGH/CRITICAL vulnerabilities found)")
              sys.exit(0)
          EOF

      - name: npm run lint
        run: npm run lint

      - name: npm run check:externos
        run: npm run check:externos

      - name: npm run build
        run: npm run build

      - name: npm run test
        run: npm run test

      - name: Upload build artefacts (para Lighthouse CI)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          retention-days: 7

  lighthouse-ci:
    name: Lighthouse CI (Accessibility & Performance gates)
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci --only=dev

      - name: Install Lighthouse CI CLI
        run: npm install -g @lhci/cli@0.12.x

      - name: Run Lighthouse CI
        run: lhci autorun --config=.lighthouserc.json
        continue-on-error: true

      - name: Resumen de scores Lighthouse
        if: always()
        run: |
          echo "## 🔦 Lighthouse — scores (mediana de 3 corridas)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Categoría | Score | Gate |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .lighthouseci/manifest.json ]; then
            # Elige la corrida representativa (isRepresentativeRun) o la primera
            LHR=$(node -e "const m=require('./.lighthouseci/manifest.json');const r=(m.find(x=>x.isRepresentativeRun)||m[0]);process.stdout.write(r.jsonPath)")
            echo "Reporte representativo: $LHR"
            node -e "
              const r=require('$LHR');
              const cats=r.categories;
              const order=['performance','accessibility','best-practices','seo'];
              for (const k of order){ if(cats[k]){ const s=Math.round(cats[k].score*100); console.log('CATEGORÍA '+cats[k].title+': '+s); require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '| '+cats[k].title+' | '+s+' | '+(k==='performance'||k==='accessibility'?'≥90':'—')+' |\n'); } }
              const a=r.audits; const m=['first-contentful-paint','largest-contentful-paint','interactive','total-blocking-time','cumulative-layout-shift','speed-index'];
              console.log('--- métricas ---');
              for(const k of m){ if(a[k]) console.log(k+': '+a[k].displayValue); }
            "
          else
            echo "No se encontró .lighthouseci/manifest.json (revisar corrida de Lighthouse)."
            echo "| (sin datos) | — | — |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results-${{ github.run_id }}
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
